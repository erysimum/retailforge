spring.application.name=notification-service
server.port=8083

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:35672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:retailforge}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:retailforge}

order.events.exchange=order-exchange
order.events.notification-queue=notification-queue
order.events.new-orders-routing-key=order.created