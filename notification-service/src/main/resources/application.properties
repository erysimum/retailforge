spring.application.name=notification-service
server.port=8083

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:35672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:retailforge}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:retailforge}

order.events.exchange=order-exchange
order.events.notification-queue=notification-queue
order.events.new-orders-routing-key=order.created


# New dead-letter configuration
order.events.notification-dlx=notification-dlx
order.events.notification-dlq=notification-dlq
order.events.notification-dlq-routing-key=notification.dlq


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:45432/notification}
spring.datasource.username=${DB_USERNAME:retailforge}
spring.datasource.password=${DB_PASSWORD:retailforge}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s