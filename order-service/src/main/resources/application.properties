spring.application.name=order-service
server.port=8082
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=*
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25432/orders}
spring.datasource.username=${DB_USERNAME:retailforge}
spring.datasource.password=${DB_PASSWORD:retailforge}


catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}
resilience4j.retry.instances.catalog.max-attempts=3
resilience4j.retry.instances.catalog.wait-duration=500ms

resilience4j.circuitbreaker.instances.catalog.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.catalog.sliding-window-size=6
resilience4j.circuitbreaker.instances.catalog.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.catalog.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalog.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.catalog.permitted-number-of-calls-in-half-open-state=2

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:35672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:retailforge}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:retailforge}

order.events.exchange=order-exchange
order.events.new-orders-queue=new-orders
order.events.new-orders-routing-key=order.created
logging.level.org.springframework.amqp=DEBUG

order.events.publish-job-cron=*/5 * * * * *