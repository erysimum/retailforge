services:
  catalog-service:
    image: catalog-service:0.0.1-SNAPSHOT
    container_name: catalog-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://catalog-db:5432/catalog
      DB_USERNAME: retailforge
      DB_PASSWORD: retailforge
    depends_on:
      catalog-db:
        condition: service_healthy