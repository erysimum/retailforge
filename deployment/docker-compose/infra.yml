services:
  catalog-db:
    image: postgres:17-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: retailforge
      POSTGRES_PASSWORD: retailforge
      POSTGRES_DB: catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailforge -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 5


  orders-db:
      image: postgres:17-alpine
      ports:
        - "25432:5432"
      environment:
        POSTGRES_USER: retailforge
        POSTGRES_PASSWORD: retailforge
        POSTGRES_DB: orders
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U retailforge -d orders" ]
        interval: 10s
        timeout: 5s
        retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "35672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: retailforge
      RABBITMQ_DEFAULT_PASS: retailforge
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
    rabbitmq-data:


