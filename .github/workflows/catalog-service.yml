name: Catalog Service CI

on:
  push:
    paths:
      - "catalog-service/**"
      - ".github/workflows/catalog-service.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check formatting and build
        run: ../mvnw spotless:check verify
