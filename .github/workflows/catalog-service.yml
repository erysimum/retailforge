name: Catalog Service CI

on:
  push:
    paths:
      - "catalog-service/**"
      - ".github/workflows/catalog-service.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check formatting and build
        run: ../mvnw spotless:check verify

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: catalog-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to ghcr.io
        run: >
          ../mvnw  spring-boot:build-image
          -DskipTests
          -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/catalog-service:${{ github.sha }}
          -Dspring-boot.build-image.publish=true
          -Ddocker.publishRegistry.username=${{ github.actor }}
          -Ddocker.publishRegistry.password=${{ secrets.GITHUB_TOKEN }}